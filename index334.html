        .cover-edit-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); color: white; display: none; align-items: center; justify-content: center; font-weight: 600; cursor: pointer; z-index: 1; font-size: 0.9rem; }

        body.edit-mode .avatar-wrapper:hover .avatar-edit-overlay { display: flex; }

<body>
    <audio id="bgMusic" loop preload="auto"></audio>

    <div class="homepage">
        <div class="navbar">
            <div class="music-player">
                <div class="music-edit-hint" id="musicEditHint">更换音乐</div>
                <div class="music-btn" id="musicPlayBtn"><i class="fas fa-play" id="musicIcon"></i></div>
                <div class="music-info">
                    <span class="music-title" id="musicTitleDisplay"></span>
                    <span class="music-artist" id="musicArtistDisplay"></span>
                </div>
            </div>

    <script>
        // ============================================================
        // 你只需要改这个对象。改完提交到 GitHub，游客打开就是这里的内容。
        // ============================================================
        const SITE_DATA = {
            name: "琥珀",
            username: "amber_starry",
            signature: "半生漂泊，半生寻觅。",
            bio: '<span><i class="fas fa-birthday-cake"></i> 21岁</span><span><i class="fas fa-star"></i> 双鱼座</span><span><i class="fas fa-brain"></i> INFP</span><span><i class="fas fa-users"></i> 星海旅团</span>',
            join: '<span><i class="fas fa-map-marker-alt"></i> 上海 · 静安</span><span><i class="far fa-calendar-alt"></i> 2021年3月加入</span>',
            following: "358",
            followers: "2.4k",
            cover: "",
            avatar: "",
            music: { id: "29722012", title: "新地球", artist: "林俊杰" },
            feeds: {
                "feed-post-1": [
                    { type: "text-img", text: "我拍下这张照片的时候，你还在我身边。现在照片还在，你走了。原来有些画面，从一开始就是用来怀念的。🖤", img: [], timestamp: 1700000000000, pinned: false },
                    { type: "text-img", text: "你走之后，我学会了在凌晨三点给自己煮面，加两个荷包蛋，一个给你留着，凉了再倒掉。这个习惯，我改了很久都没改掉。", img: [], timestamp: 1699900000000, pinned: false }
                ],
                "feed-post-3": [
                    { type: "text-img", text: "收录了一些空洞的几何轨迹。", img: [], timestamp: 1699800000000, pinned: false }
                ],
                "feed-post-4": [
                    { type: "text-img", text: "“你问我还爱不爱你，我说不爱了。”", img: [], timestamp: 1699700000000, pinned: false }
                ],
                "feed-post-5": [
                    { type: "text-img", text: "“我没有在等你，我只是暂时还没办法喜欢上别人。”", img: [], timestamp: 1699600000000, pinned: false }
                ],
                "feed-post-6": [
                    { type: "text-img", text: "感谢「星海旅团」为本频道提供的独家冠名支持。", img: [], timestamp: 1699500000000, pinned: false }
                ]
            },
            accordion: [
                { id: 1, title: "互动指南与边界感", content: "欢迎来到琥珀的星空。私信前请先看主页简介，不接急单，不聊无关话题。感谢理解与尊重。" },
                { id: 2, title: "营业时间与回复频率", content: "通常在深夜出没，白天可能在补觉或者发呆。消息回复较慢，但看到一定会回。" }
            ]
        };

        (function() {
            // 运行时数据（可被编辑，但不会自动写回源码）
            let DATA = JSON.parse(JSON.stringify(SITE_DATA));

            function linkify(text) {
                const urlRegex = /((https?:\/\/)[^\s]+)/g;
                return text.replace(urlRegex, (url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
            }

            // 控制台输出最新数据，方便你复制回 SITE_DATA
            window.dumpData = function() {
                const str = 'const SITE_DATA = ' + JSON.stringify(DATA, null, 4) + ';';
                console.log(str);
                try {
                    copy(str);
                    console.log('已复制到剪贴板，粘贴回代码里的 SITE_DATA 即可');
                } catch(e) {
                    console.log('请手动复制上面的内容');
                }
            };

            // ================= 音乐 =================
            const bgMusic = document.getElementById('bgMusic');
            const musicPlayBtn = document.getElementById('musicPlayBtn');
            const musicIcon = document.getElementById('musicIcon');
            const musicEditHint = document.getElementById('musicEditHint');
            const musicConfigOverlay = document.getElementById('musicConfigOverlay');
            let isPlaying = false;

            function applyMusic() {
                const m = DATA.music || {};
                document.getElementById('musicTitleDisplay').textContent = m.title || '未知歌曲';
                document.getElementById('musicArtistDisplay').textContent = m.artist || '未知歌手';
                if (m.id) bgMusic.src = `https://music.163.com/song/media/outer/url?id=${m.id}.mp3`;
            }
            applyMusic();

            function attemptPlay() {
                if (isPlaying) return;
                const p = bgMusic.play();
                if (p !== undefined) p.then(() => { musicIcon.className = 'fas fa-pause'; isPlaying = true; }).catch(() => {});
            }
            document.addEventListener('click', function initPlay() { attemptPlay(); document.removeEventListener('click', initPlay); }, { once: true });
            musicPlayBtn.addEventListener('click', function() {
                if (isPlaying) { bgMusic.pause(); musicIcon.className = 'fas fa-play'; isPlaying = false; }
                else attemptPlay();
            });
            bgMusic.addEventListener('play', () => { musicIcon.className = 'fas fa-pause'; isPlaying = true; });
            bgMusic.addEventListener('pause', () => { musicIcon.className = 'fas fa-play'; isPlaying = false; });

            musicEditHint.addEventListener('click', function() {
                if (!document.body.classList.contains('edit-mode')) return;
                document.getElementById('configMusicId').value = DATA.music.id || '';
                document.getElementById('configMusicTitle').value = DATA.music.title || '';
                document.getElementById('configMusicArtist').value = DATA.music.artist || '';
                musicConfigOverlay.classList.add('active');
            });
            window.saveMusicConfig = function() {
                DATA.music = {
                    id: document.getElementById('configMusicId').value.trim(),
                    title: document.getElementById('configMusicTitle').value.trim() || '未知歌曲',
                    artist: document.getElementById('configMusicArtist').value.trim() || '未知歌手'
                };
                applyMusic();
                musicConfigOverlay.classList.remove('active');
                window.dumpData();
            };

            // ================= 图片预览 =================
            const imagePreviewOverlay = document.getElementById('imagePreviewOverlay');
            const previewContainer = document.getElementById('previewContainer');
            const previewIndicator = document.getElementById('previewIndicator');
            window.openImagePreview = function(images, currentIndex) {
                previewContainer.innerHTML = '';
                images.forEach((src) => {
                    const slide = document.createElement('div');
                    slide.className = 'preview-slide';
                    const img = document.createElement('img');
                    img.src = src;
                    slide.appendChild(img);
                    previewContainer.appendChild(slide);
                });
                const update = () => {
                    const i = Math.round(previewContainer.scrollLeft / previewContainer.clientWidth) + 1;
                    previewIndicator.textContent = `${i} / ${images.length}`;
                };
                setTimeout(() => { previewContainer.scrollLeft = previewContainer.clientWidth * currentIndex; update(); }, 50);
                previewContainer.onscroll = update;
                imagePreviewOverlay.classList.add('active');
            };
            window.closeImagePreview = function() {
                imagePreviewOverlay.classList.remove('active');
                previewContainer.innerHTML = '';
                previewIndicator.textContent = '';
            };
            document.addEventListener('contextmenu', (e) => { if (e.target.tagName === 'IMG') e.preventDefault(); });

            let currentPostIndex = -1, currentImageIndex = -1, currentEditingPostId = null, currentEditingIndex = null;
            const SECRET_KEY = '3344';

            function formatTimeAgo(ts) {
                const diff = Date.now() - ts;
                const m = Math.floor(diff / 60000);
                if (m < 1) return '刚刚';
                if (m < 60) return `${m}分钟前`;
                const h = Math.floor(m / 60);
                if (h < 24) return `${h}小时前`;
                return `${Math.floor(h / 24)}天前`;
            }

            function compressImage(file, maxW = 1200, maxH = 1200, quality = 0.7) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.src = ev.target.result;
                        img.onload = () => {
                            let w = img.width, h = img.height;
                            if (w > maxW || h > maxH) {
                                if (w > h) { if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; } }
                                else { if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; } }
                            }
                            const c = document.createElement('canvas');
                            c.width = w; c.height = h;
                            c.getContext('2d').drawImage(img, 0, 0, w, h);
                            resolve(c.toDataURL('image/jpeg', quality));
                        };
                        img.onerror = reject;
                    };
                    reader.onerror = reject;
                });
            }

            // ================= 渲染信息 =================
            function renderProfile() {
                document.getElementById('editName').innerHTML = DATA.name + ' <i class="fas fa-certificate" style="color:var(--c-primary)"></i>';
                document.getElementById('usernameDisplay').textContent = DATA.username;
                document.title = DATA.username + "'s Starry Sky";
                document.getElementById('editSignature').innerText = DATA.signature;
                document.getElementById('editBio').innerHTML = DATA.bio;
                document.getElementById('editJoinDate').innerHTML = DATA.join;
                document.getElementById('statFollowing').textContent = DATA.following;
                document.getElementById('statFollowers').textContent = DATA.followers;
                document.getElementById('profileCover').style.backgroundImage = DATA.cover ? `url(${DATA.cover})` : '';
                const av = document.getElementById('mainAvatarImg');
                if (DATA.avatar) { av.src = DATA.avatar; document.getElementById('mainAvatar').classList.add('has-img'); }
                else { av.src = ''; document.getElementById('mainAvatar').classList.remove('has-img'); }
            }

            // ================= 帖子渲染 =================
            function renderFeeds(postId, containerId) {
                const container = document.getElementById(containerId);
                if (!container) return;
                let feeds = DATA.feeds[postId] || [];
                feeds.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
                container.innerHTML = '';

                feeds.forEach((item, index) => {
                    const feedItem = document.createElement('div');
                    feedItem.className = 'feed-item' + (item.pinned ? ' pinned' : '');
                    if (item.pinned) {
                        const badge = document.createElement('div');
                        badge.className = 'pinned-badge';
                        badge.innerHTML = '<i class="fas fa-thumbtack"></i> 置顶';
                        feedItem.appendChild(badge);
                    }

                    const header = document.createElement('div');
                    header.className = 'feed-header';
                    const avatarDiv = document.createElement('div');
                    avatarDiv.className = 'feed-avatar';
                    if (DATA.avatar) { avatarDiv.classList.add('has-img'); avatarDiv.innerHTML = `<img src="${DATA.avatar}" alt="">`; }
                    header.appendChild(avatarDiv);

                    const meta = document.createElement('div');
                    meta.className = 'feed-meta';
                    meta.innerHTML = `<span class="feed-name">琥珀</span><span class="feed-username">@${DATA.username}</span>`;
                    header.appendChild(meta);

                    const time = document.createElement('span');
                    time.className = 'feed-time';
                    time.innerText = '· ' + formatTimeAgo(item.timestamp || Date.now());
                    header.appendChild(time);
                    feedItem.appendChild(header);

                    if (item.type !== 'img') {
                        const wrap = document.createElement('div');
                        wrap.className = 'feed-text-wrapper';
                        const textDiv = document.createElement('div');
                        textDiv.className = 'feed-text';
                        textDiv.setAttribute('contenteditable', 'false');
                        textDiv.dataset.postid = postId;
                        textDiv.dataset.index = index;
                        textDiv.innerHTML = linkify(item.text || '');
                        wrap.appendChild(textDiv);
                        const editBtn = document.createElement('div');
                        editBtn.className = 'feed-text-edit-btn';
                        editBtn.innerHTML = '<i class="fas fa-pen"></i>';
                        editBtn.onclick = (e) => {
                            e.stopPropagation();
                            if (!document.body.classList.contains('edit-mode')) return;
                            currentEditingPostId = postId;
                            currentEditingIndex = index;
                            document.getElementById('textEditArea').value = item.text || '';
                            document.getElementById('textEditOverlay').classList.add('active');
                        };
                        wrap.appendChild(editBtn);
                        feedItem.appendChild(wrap);
                    }

                    if (item.type !== 'text') {
                        const grid = document.createElement('div');
                        grid.className = 'feed-image-grid';
                        grid.dataset.count = Math.max(1, item.img.length);
                        item.img.forEach((src, imgIdx) => {
                            const box = document.createElement('div');
                            box.className = 'grid-image-item' + (item.img.length === 1 ? ' single' : '');
                            const img = document.createElement('img');
                            img.src = src;
                            box.appendChild(img);
                            box.onclick = (e) => { e.stopPropagation(); window.openImagePreview(item.img, imgIdx); };
                            const overlay = document.createElement('div');
                            overlay.className = 'img-edit-overlay';
                            overlay.innerHTML = '<i class="fas fa-image"></i>';
                            overlay.onclick = (e) => {
                                e.stopPropagation();
                                if (!document.body.classList.contains('edit-mode')) return;
                                currentPostIndex = index;
                                currentImageIndex = imgIdx;
                                document.getElementById('globalImgInput').click();
                            };
                            box.appendChild(overlay);
                            const del = document.createElement('div');
                            del.className = 'img-delete-btn';
                            del.innerHTML = '<i class="fas fa-times"></i>';
                            del.onclick = (e) => {
                                e.stopPropagation();
                                if (!document.body.classList.contains('edit-mode')) return;
                                if (confirm('确定删除这张图片吗？')) {
                                    feeds[index].img.splice(imgIdx, 1);
                                    renderFeeds(postId, containerId);
                                    window.dumpData();
                                }
                            };
                            box.appendChild(del);
                            grid.appendChild(box);
                        });
                        if (document.body.classList.contains('edit-mode') && item.img.length < 3) {
                            const add = document.createElement('div');
                            add.className = 'grid-add-btn';
                            add.innerHTML = '<i class="fas fa-plus"></i>';
                            add.onclick = (e) => {
                                e.stopPropagation();
                                currentPostIndex = index;
                                currentImageIndex = -1;
                                document.getElementById('globalImgInput').click();
                            };
                            grid.appendChild(add);
                        }
                        feedItem.appendChild(grid);
                    }

                    const actions = document.createElement('div');
                    actions.className = 'feed-actions-row';
                    const pinBtn = document.createElement('div');
                    pinBtn.className = 'action-btn ' + (item.pinned ? 'unpin-btn' : 'pin-btn');
                    pinBtn.innerHTML = item.pinned ? '<i class="fas fa-thumbtack"></i> 取消置顶' : '<i class="fas fa-thumbtack"></i> 置顶';
                    pinBtn.onclick = () => {
                        if (!document.body.classList.contains('edit-mode')) return;
                        feeds.forEach((f, i) => { if (i !== index) f.pinned = false; });
                        feeds[index].pinned = !feeds[index].pinned;
                        renderFeeds(postId, containerId);
                        window.dumpData();
                    };
                    actions.appendChild(pinBtn);
                    if (feeds.length > 1) {
                        const del = document.createElement('div');
                        del.className = 'action-btn delete-btn';
                        del.innerHTML = '<i class="fas fa-trash"></i> 删除帖子';
                        del.onclick = () => {
                            if (!document.body.classList.contains('edit-mode')) return;
                            if (confirm('确定删除这组图文吗？')) {
                                feeds.splice(index, 1);
                                renderFeeds(postId, containerId);
                                window.dumpData();
                            }
                        };
                        actions.appendChild(del);
                    }
                    feedItem.appendChild(actions);
                    container.appendChild(feedItem);
                });

                const addActions = document.createElement('div');
                addActions.className = 'add-actions';
                ['图文', '图片', '文字'].forEach((label, i) => {
                    const btn = document.createElement('div');
                    btn.className = 'add-new-feed-btn';
                    btn.innerHTML = `<i class="fas fa-${i === 0 ? 'edit' : i === 1 ? 'image' : 'font'}"></i> ${label}`;
                    btn.onclick = () => {
                        if (!document.body.classList.contains('edit-mode')) return;
                        const type = i === 0 ? 'text-img' : i === 1 ? 'img' : 'text';
                        feeds.push({ type, text: type === 'img' ? '' : '新的内容...', img: [], timestamp: Date.now(), pinned: false });
                        renderFeeds(postId, containerId);
                        window.dumpData();
                    };
                    addActions.appendChild(btn);
                });
                container.appendChild(addActions);
            }

            function initAllFeeds() {
                renderFeeds('feed-post-1', 'feed-post-1');
                document.getElementById('statPosts').textContent = (DATA.feeds['feed-post-1'] || []).length;
                ['feed-post-3', 'feed-post-4', 'feed-post-5', 'feed-post-6'].forEach(id => renderFeeds(id, id));
            }

            // ================= 须知 =================
            function renderAccordion() {
                const container = document.getElementById('accordionContainer');
                container.innerHTML = '';
                DATA.accordion.forEach((item, index) => {
                    const acc = document.createElement('div');
                    acc.className = 'accordion-item';
                    const header = document.createElement('div');
                    header.className = 'accordion-header';
                    header.onclick = () => acc.classList.toggle('active');
                    header.innerHTML = `<div class="accordion-icon"><i class="fas fa-book-open"></i></div>`;
                    const title = document.createElement('div');
                    title.className = 'accordion-title';
                    title.setAttribute('contenteditable', 'false');
                    title.innerText = item.title;
                    title.addEventListener('blur', function() {
                        if (!document.body.classList.contains('edit-mode')) return;
                        DATA.accordion[index].title = this.innerText.trim() || item.title;
                        window.dumpData();
                    });
                    header.appendChild(title);
                    header.innerHTML += '<i class="fas fa-chevron-down accordion-arrow"></i>';
                    acc.appendChild(header);

                    const body = document.createElement('div');
                    body.className = 'accordion-body';
                    const desc = document.createElement('div');
                    desc.className = 'accordion-desc';
                    desc.setAttribute('contenteditable', 'false');
                    desc.innerHTML = linkify(item.content);
                    desc.addEventListener('blur', function() {
                        if (!document.body.classList.contains('edit-mode')) return;
                        DATA.accordion[index].content = this.innerHTML;
                        window.dumpData();
                    });
                    body.appendChild(desc);
                    acc.appendChild(body);
                    container.appendChild(acc);
                });
            }

            window.openAddAccordionModal = function() {
                if (!document.body.classList.contains('edit-mode')) return;
                document.getElementById('newAccTitle').value = '';
                document.getElementById('newAccContent').value = '';
                document.getElementById('addAccOverlay').classList.add('active');
            };
            window.saveNewAccordion = function() {
                const title = document.getElementById('newAccTitle').value.trim();
                const content = document.getElementById('newAccContent').value.trim();
                if (!title) { alert('请输入标题'); return; }
                DATA.accordion.push({ id: Date.now(), title, content: content || '暂无内容' });
                renderAccordion();
                document.getElementById('addAccOverlay').classList.remove('active');
                window.dumpData();
            };

            // ================= 模式切换 =================
            const body = document.body;
            const pwdOverlay = document.getElementById('pwdOverlay');
            const pwdInput = document.getElementById('pwdInput');
            const pwdError = document.getElementById('pwdError');
            const modeBtns = document.querySelectorAll('.mode-btn');

            function setMode(mode) {
                if (mode === 'edit') {
                    body.classList.add('edit-mode');
                    document.querySelectorAll('[contenteditable]').forEach(el => el.setAttribute('contenteditable', 'true'));
                    document.querySelectorAll('.feed-text').forEach(el => el.setAttribute('contenteditable', 'true'));
                } else {
                    body.classList.remove('edit-mode');
                    document.querySelectorAll('[contenteditable]').forEach(el => el.setAttribute('contenteditable', 'false'));
                    document.querySelectorAll('.feed-text').forEach(el => el.setAttribute('contenteditable', 'false'));
                }
                renderProfile();
                initAllFeeds();
                renderAccordion();
                modeBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
            }

            modeBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    if (this.classList.contains('active')) return;
                    if (this.dataset.mode === 'edit') {
                        pwdOverlay.classList.add('active');
                        pwdInput.value = '';
                        pwdError.classList.remove('show');
                        setTimeout(() => pwdInput.focus(), 100);
                    } else {
                        setMode('preview');
                    }
                });
            });

            document.getElementById('pwdConfirm').addEventListener('click', function() {
                if (pwdInput.value === SECRET_KEY) {
                    setMode('edit');
                    pwdOverlay.classList.remove('active');
                    console.log('已进入编辑模式。改完后在控制台执行 dumpData()，把输出复制回代码里的 SITE_DATA。');
                } else {
                    pwdError.classList.add('show');
                    pwdInput.value = '';
                }
            });
            document.getElementById('pwdCancel').addEventListener('click', () => pwdOverlay.classList.remove('active'));

            window.saveTextOnlyEdit = function() {
                const val = document.getElementById('textEditArea').value;
                if (currentEditingPostId !== null && currentEditingIndex !== null) {
                    const feeds = DATA.feeds[currentEditingPostId];
                    if (feeds && feeds[currentEditingIndex]) {
                        feeds[currentEditingIndex].text = val;
                        if (!val.trim()) feeds[currentEditingIndex].type = 'img';
                        else if (feeds[currentEditingIndex].type === 'img') feeds[currentEditingIndex].type = 'text-img';
                        renderFeeds(currentEditingPostId, currentEditingPostId);
                        window.dumpData();
                    }
                }
                document.getElementById('textEditOverlay').classList.remove('active');
            };

            document.addEventListener('blur', function(e) {
                const t = e.target;
                if (t.getAttribute('contenteditable') !== 'true') return;
                if (t.id === 'editUsername') {
                    const raw = t.innerText.replace('@', '').trim();
                    if (raw) { DATA.username = raw; renderProfile(); initAllFeeds(); window.dumpData(); }
                    return;
                }
                if (t.id === 'editName') {
                    DATA.name = t.innerText.replace(/<i class="fas fa-certificate".*?<\/i>/, '').trim();
                    renderProfile(); window.dumpData(); return;
                }
                if (t.id === 'editSignature') { DATA.signature = t.innerText; window.dumpData(); return; }
                const bio = t.closest('#editBio');
                if (bio) { DATA.bio = bio.innerHTML; window.dumpData(); return; }
                const join = t.closest('#editJoinDate');
                if (join) { DATA.join = join.innerHTML; window.dumpData(); return; }
                if (t.id === 'statFollowing') { DATA.following = t.innerText; window.dumpData(); return; }
                if (t.id === 'statFollowers') { DATA.followers = t.innerText; window.dumpData(); return; }
                if (t.classList.contains('feed-text')) {
                    const postId = t.dataset.postid;
                    const index = parseInt(t.dataset.index);
                    const feeds = DATA.feeds[postId];
                    if (feeds && feeds[index]) {
                        feeds[index].text = t.innerText;
                        if (!t.innerText.trim() && feeds[index].type === 'text-img') feeds[index].type = 'img';
                        window.dumpData();
                    }
                }
            }, true);

            // ================= 图片上传 =================
            const coverInput = document.getElementById('coverInput');
            document.getElementById('triggerCoverUpload').addEventListener('click', () => { if (body.classList.contains('edit-mode')) coverInput.click(); });
            coverInput.addEventListener('change', async function(e) {
                const f = e.target.files[0]; if (!f) return;
                DATA.cover = await compressImage(f);
                renderProfile();
                window.dumpData();
            });

            const avatarInput = document.getElementById('avatarInput');
            document.getElementById('triggerAvatarUpload').addEventListener('click', () => { if (body.classList.contains('edit-mode')) avatarInput.click(); });
            avatarInput.addEventListener('change', async function(e) {
                const f = e.target.files[0]; if (!f) return;
                DATA.avatar = await compressImage(f, 300, 300);
                renderProfile(); initAllFeeds();
                window.dumpData();
            });

            const globalImgInput = document.getElementById('globalImgInput');
            globalImgInput.addEventListener('change', async function(e) {
                const files = e.target.files;
                if (!files || !files.length || currentPostIndex === -1) return;
                const feeds = DATA.feeds[currentPostIdForUpload()];
                if (!feeds || !feeds[currentPostIndex]) { this.value = ''; return; }
                if (currentImageIndex === -1) {
                    const remain = 3 - feeds[currentPostIndex].img.length;
                    if (remain <= 0) { alert('最多 3 张'); this.value = ''; return; }
                    const arr = Array.from(files).slice(0, remain);
                    for (const f of arr) feeds[currentPostIndex].img.push(await compressImage(f));
                } else {
                    feeds[currentPostIndex].img[currentImageIndex] = await compressImage(files[0]);
                }
                this.value = '';
                const pid = currentPostIdForUpload();
                renderFeeds(pid, pid);
                window.dumpData();
            });

            let uploadPostId = null;
            function currentPostIdForUpload() { return uploadPostId || 'feed-post-1'; }

            // 给每个帖子容器绑定当前 postId（渲染时用 data-postid 记录更稳，这里用全局记录）
            document.querySelectorAll('.design-post').forEach(el => {
                el.addEventListener('click', () => { uploadPostId = el.id; }, true);
            });

            // ================= 标签页 =================
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById(this.dataset.tab).classList.add('active');
                });
            });

            // ================= 启动 =================
            renderProfile();
            initAllFeeds();
            renderAccordion();
            setMode('preview');
        })();
    </script>
</body>
</html>
